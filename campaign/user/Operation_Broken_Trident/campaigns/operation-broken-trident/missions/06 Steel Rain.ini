[Language_en]
Taskforce1LandUnit1NameOverride=Souda Bay Air Base (Crete)
Taskforce1LandUnit1ShortNameOverride=SOUDA BAY
Name=06 Steel Rain
Description=Hold a radar picket south of Crete through a coordinated Soviet bomber and missile-ship attack. Reinforced opposition includes fighter patrols, layered shore defences and independent merchant and fishing traffic.
Objective_Primary=Keep at least one task group ship on station until relief arrives
Objective_Survive=Preserve at least one task group vessel
Taskforce1StartMessage=<color=yellow>Steel Rain</color>|A Soviet Tu-16 missile regiment has launched from supporting airfields. The task force is ordered to maintain the picket until NATO air cover arrives. Anti-air warfare and disciplined emissions will decide whether the group survives.|THREAT UPDATE: Soviet expeditionary aircraft operate from fictional Libyan access facilities (Syrian access for the Cyprus operation). Expect fighter cover, bomber attacks from separated bearings, silent missile ships and emitting escorts. Shore SAMs defend their air corridors. Three independent merchant/fishing contacts cross the area; radar silence or proximity to an enemy does not establish hostile identity. Identify contacts before engaging.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|Sixth Fleet acknowledges tasking complete. Ships and weapon state will be carried forward.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|Sixth Fleet records the operational objective as failed.
Taskforce2VictoryMessage=<color=lime>Opposing force successful.</color>|NATO did not accomplish the assigned objective.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The NATO group has completed its mission.
