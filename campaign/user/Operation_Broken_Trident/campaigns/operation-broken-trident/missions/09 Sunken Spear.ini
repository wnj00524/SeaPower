[Language_en]
Taskforce1LandUnit1NameOverride=Souda Bay Air Base (Crete)
Taskforce1LandUnit1ShortNameOverride=SOUDA BAY
Name=09 Sunken Spear
Description=Destroy a Soviet Slava-class missile cruiser operating as the forward command ship in the eastern Mediterranean. Reinforced opposition includes fighter patrols, layered shore defences and independent merchant and fishing traffic.
Objective_Primary=Destroy the Slava cruiser and designated Krivak escort. Limit: 150 min.
Objective_Survive=Preserve at least one task group vessel
Taskforce1StartMessage=<color=yellow>09 Sunken Spear — The command ship and its shield</color>|The cruiser matters. So does the escort that keeps it useful. Your orders name both; sinking the largest hull alone will not finish this task.|Destroy the Slava cruiser and designated Krivak escort within 150 minutes. Preserve at least one task-group vessel. Additional escorts and shore sites are not compulsory targets.|ROE: identify surface contacts before firing. Civilian traffic remains in the area.|No pre-mission rearm or repair is offered for this sortie. Use Souda Bay Air Base (Crete) for aircraft you have purchased, assigned and prepared. No free friendly combat aircraft are promised. Ships and ammunition state carry through the campaign.
Taskforce1VictoryMessage=<color=lime>Task complete.</color>|The designated cruiser and Krivak escort have both been destroyed. The forward command element is broken locally, though surviving enemies may still be capable of independent action.|Surviving ships and recorded weapon state carry forward.
Taskforce1DefeatMessage=<color=red>Task failed.</color>|The required pair has not been destroyed within the operational window. The command ship's detachment remains an unresolved obstacle to the campaign's next movement.
Taskforce2VictoryMessage=<color=lime>Opposing force successful.</color>|NATO did not accomplish the assigned objective.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The NATO group has completed its mission.
