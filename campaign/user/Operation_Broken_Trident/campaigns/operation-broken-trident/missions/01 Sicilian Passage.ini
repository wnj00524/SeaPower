[Language_en]
Taskforce1LandUnit1NameOverride=NAS Sigonella (Sicily)
Taskforce1LandUnit1ShortNameOverride=SIGONELLA
Name=01 Sicilian Passage
Description=Escort M/V Sea Amber through the southern approaches to Malta while an unidentified missile craft group tests the new rules of engagement. Reinforced opposition includes fighter patrols, layered shore defences and independent merchant and fishing traffic.
Objective_Primary=Escort M/V Sea Amber to the safety area. Limit: 180 min.
NeutralVessel1NameOverride=M/V Sea Amber
Objective_Survive=Preserve at least one task group vessel
Objective_Civilian=Do not lose the protected transport
Taskforce1StartMessage=<color=yellow>01 Sicilian Passage — The first ship through</color>|The Sea Amber's master has asked whether he should turn back. Sixth Fleet has told him his escort is coming. That assurance now rests with you.|Keep M/V Sea Amber afloat and bring her into the marked safety area within 180 minutes. Preserve at least one task-group vessel.|ROE: identify surface contacts before firing. Civilian traffic remains in the area.|Rearm and repair are offered before this mission. Use NAS Sigonella (Sicily) for aircraft you have purchased, assigned and prepared. No free friendly combat aircraft are promised. Ships and ammunition state carry through the campaign.
Taskforce1VictoryMessage=<color=lime>Task complete.</color>|Sea Amber has reached the assigned safety area. Her master reports the crew remaining at stations. The stores are still afloat; the political crisis is unresolved.|Surviving ships and recorded weapon state carry forward.
Taskforce1DefeatMessage=<color=red>Task failed.</color>|The southern passage has not been secured. Command must suspend this movement and account for the ships and cargo committed to it.
Taskforce2VictoryMessage=<color=lime>Opposing force successful.</color>|NATO did not accomplish the assigned objective.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The NATO group has completed its mission.
Taskforce1CivilianLossMessage=<color=red>Protected ship lost.</color>|The southern passage has not been secured. Command must suspend this movement and account for the ships and cargo committed to it.
