[Language_en]
Taskforce1LandUnit1NameOverride=Souda Bay Air Base (Crete)
Taskforce1LandUnit1ShortNameOverride=SOUDA BAY
Name=08 Guard the Oiler
Description=Cover an underway-replenishment rendezvous while Soviet surface units seek the support ship. Reinforced opposition includes fighter patrols, layered shore defences and independent merchant and fishing traffic.
Objective_Primary=Escort USNS Stonehaven (fictional) to the safety area. Limit: 180 min.
NeutralVessel1NameOverride=USNS Stonehaven (fictional)
Objective_Survive=Preserve at least one task group vessel
Objective_Civilian=Do not lose the protected transport
Taskforce1StartMessage=<color=yellow>08 Guard the Oiler — The ship that keeps ships moving</color>|An oiler makes a poor headline and an excellent target. Stonehaven is the reason another task group will have choices tomorrow.|Keep USNS Stonehaven (fictional) afloat and bring her into the marked safety area within 180 minutes. Preserve at least one task-group vessel.|ROE: identify surface contacts before firing. Civilian traffic remains in the area.|Rearm and repair are offered before this mission. Use Souda Bay Air Base (Crete) for aircraft you have purchased, assigned and prepared. No free friendly combat aircraft are promised. Ships and ammunition state carry through the campaign.
Taskforce1VictoryMessage=<color=lime>Task complete.</color>|Stonehaven has reached the safety area intact. The support movement is preserved. Fuel transfer and fleet resupply are narrative context, not additional scripted actions in this mission.|Surviving ships and recorded weapon state carry forward.
Taskforce1DefeatMessage=<color=red>Task failed.</color>|The support movement has failed. A fleet may still possess ships and weapons yet lose freedom of action when its logistics cannot reach it.
Taskforce2VictoryMessage=<color=lime>Opposing force successful.</color>|NATO did not accomplish the assigned objective.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The NATO group has completed its mission.
Taskforce1CivilianLossMessage=<color=red>Protected ship lost.</color>|The support movement has failed. A fleet may still possess ships and weapons yet lose freedom of action when its logistics cannot reach it.
