[Language_en]
Taskforce1LandUnit1NameOverride=NAS Sigonella (Sicily)
Taskforce1LandUnit1ShortNameOverride=SIGONELLA
Name=03 The Narrows
Description=Push an urgent logistics freighter through the Sicily Channel in spite of Soviet patrol craft. Reinforced opposition includes fighter patrols, layered shore defences and independent merchant and fishing traffic.
Objective_Primary=Escort M/V Harbor Crown to the safety area. Limit: 180 min.
NeutralVessel1NameOverride=M/V Harbor Crown
Objective_Survive=Preserve at least one task group vessel
Objective_Civilian=Do not lose the protected transport
Taskforce1StartMessage=<color=yellow>03 The Narrows — Cargo before prestige</color>|The Harbor Crown is neither fast nor expendable. You have been sent to deliver a ship, not to collect a list of enemy hulls sunk.|Keep M/V Harbor Crown afloat and bring her into the marked safety area within 180 minutes. Preserve at least one task-group vessel.|ROE: identify surface contacts before firing. Civilian traffic remains in the area.|Rearm and repair are offered before this mission. Use NAS Sigonella (Sicily) for aircraft you have purchased, assigned and prepared. No free friendly combat aircraft are promised. Ships and ammunition state carry through the campaign.
Taskforce1VictoryMessage=<color=lime>Task complete.</color>|Harbor Crown has entered the safety area. The logistics movement can continue beyond this tactical leg. Command records a delivery, not a claim that the shipping lanes are now uncontested.|Surviving ships and recorded weapon state carry forward.
Taskforce1DefeatMessage=<color=red>Task failed.</color>|The logistics passage has failed. The consequences will be felt on the next schedule: delayed stores, diverted shipping and fewer choices for the force.
Taskforce2VictoryMessage=<color=lime>Opposing force successful.</color>|NATO did not accomplish the assigned objective.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The NATO group has completed its mission.
Taskforce1CivilianLossMessage=<color=red>Protected ship lost.</color>|The logistics passage has failed. The consequences will be felt on the next schedule: delayed stores, diverted shipping and fewer choices for the force.
