[Language_en]
Taskforce1LandUnit1NameOverride=Souda Bay Air Base (Crete)
Taskforce1LandUnit1ShortNameOverride=SOUDA BAY
Name=12 Broken Trident
Description=Confront the last major Soviet surface strike group south of Crete and end the Mediterranean naval offensive. Reinforced opposition includes fighter patrols, layered shore defences and independent merchant and fishing traffic.
Objective_Primary=Destroy the hostile surface action group
Objective_Survive=Preserve at least one task group vessel
Taskforce1StartMessage=<color=yellow>Broken Trident</color>|Ceasefire negotiations now depend on the fleets separating. The remaining Soviet squadron, built around a Slava-class cruiser, is preparing one final missile action. Neutralise its offensive units while retaining enough ships to return to port.|THREAT UPDATE: Soviet expeditionary aircraft operate from fictional Libyan access facilities (Syrian access for the Cyprus operation). Expect fighter cover, bomber attacks from separated bearings, silent missile ships and emitting escorts. Shore SAMs defend their air corridors. Three independent merchant/fishing contacts cross the area; radar silence or proximity to an enemy does not establish hostile identity. Identify contacts before engaging.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|Sixth Fleet acknowledges tasking complete. Ships and weapon state will be carried forward.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|Sixth Fleet records the operational objective as failed.
Taskforce2VictoryMessage=<color=lime>Opposing force successful.</color>|NATO did not accomplish the assigned objective.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The NATO group has completed its mission.
