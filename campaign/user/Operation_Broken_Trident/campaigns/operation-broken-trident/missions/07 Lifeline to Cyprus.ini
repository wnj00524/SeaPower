[Language_en]
Taskforce1LandUnit1NameOverride=RAF Akrotiri (Cyprus)
Taskforce1LandUnit1ShortNameOverride=AKROTIRI
Name=07 Lifeline to Cyprus
Description=Protect a relief freighter travelling into the Cyprus approaches while Soviet surface forces attempt to establish a blockade. Reinforced opposition includes fighter patrols, layered shore defences and independent merchant and fishing traffic.
Objective_Primary=Escort M/V Levant Promise to the safety area. Limit: 180 min.
NeutralVessel1NameOverride=M/V Levant Promise
Objective_Survive=Preserve at least one task group vessel
Objective_Civilian=Do not lose the protected transport
Taskforce1StartMessage=<color=yellow>07 Lifeline to Cyprus — A promise in the manifest</color>|The Levant Promise's cargo has a destination and a list of people waiting for it. Keep those facts in view when the radar begins to fill.|Keep M/V Levant Promise afloat and bring her into the marked safety area within 180 minutes. Preserve at least one task-group vessel.|ROE: identify surface contacts before firing. Civilian traffic remains in the area.|Rearm and repair are offered before this mission. Use RAF Akrotiri (Cyprus) for aircraft you have purchased, assigned and prepared. No free friendly combat aircraft are promised. Ships and ammunition state carry through the campaign.
Taskforce1VictoryMessage=<color=lime>Task complete.</color>|Levant Promise has reached the assigned safety area. Her relief cargo remains afloat and can continue beyond this escort leg. The wider humanitarian delivery is still a future task.|Surviving ships and recorded weapon state carry forward.
Taskforce1DefeatMessage=<color=red>Task failed.</color>|The relief movement has failed to reach safety. For the people awaiting its cargo, that is a practical delay rather than an entry on a naval scorecard.
Taskforce2VictoryMessage=<color=lime>Opposing force successful.</color>|NATO did not accomplish the assigned objective.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The NATO group has completed its mission.
Taskforce1CivilianLossMessage=<color=red>Protected ship lost.</color>|The relief movement has failed to reach safety. For the people awaiting its cargo, that is a practical delay rather than an entry on a naval scorecard.
Taskforce2LandUnit1NameOverride=Expeditionary aviation detachment
Taskforce2LandUnit2NameOverride=Long-range SAM battery
Taskforce2LandUnit3NameOverride=Airfield point defence
Taskforce2LandUnit4NameOverride=Coastal missile battery
Taskforce2LandUnit5NameOverride=Early warning radar
NeutralVessel2NameOverride=M/V Levant Trader
