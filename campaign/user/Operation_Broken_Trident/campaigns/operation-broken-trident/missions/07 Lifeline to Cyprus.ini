[Language_en]
Taskforce1LandUnit1NameOverride=RAF Akrotiri (Cyprus)
Taskforce1LandUnit1ShortNameOverride=AKROTIRI
Name=07 Lifeline to Cyprus
Description=Protect a relief freighter travelling into the Cyprus approaches while Soviet surface forces attempt to establish a blockade. Reinforced opposition includes fighter patrols, layered shore defences and independent merchant and fishing traffic.
Objective_Primary=Keep the convoy vessel alive and deliver her to the marked waypoint
NeutralVessel1NameOverride=M/V Levant Promise
Objective_Survive=Preserve at least one task group vessel
Objective_Civilian=Do not lose the protected transport
Taskforce1StartMessage=<color=yellow>Lifeline to Cyprus</color>|Cyprus remains neutral in the crisis. A contracted civilian freighter carries medical supplies and evacuation equipment. Escort her without entering restricted coastal waters. Enemy missile craft are positioned to cut the route.|THREAT UPDATE: Soviet expeditionary aircraft operate from fictional Libyan access facilities (Syrian access for the Cyprus operation). Expect fighter cover, bomber attacks from separated bearings, silent missile ships and emitting escorts. Shore SAMs defend their air corridors. Three independent merchant/fishing contacts cross the area; radar silence or proximity to an enemy does not establish hostile identity. Identify contacts before engaging.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|Sixth Fleet acknowledges tasking complete. Ships and weapon state will be carried forward.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|Sixth Fleet records the operational objective as failed.
Taskforce2VictoryMessage=<color=lime>Opposing force successful.</color>|NATO did not accomplish the assigned objective.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The NATO group has completed its mission.
Taskforce1CivilianLossMessage=<color=red>Protected transport lost.</color>|This operation has failed: the ship assigned to your protection was sunk.
Taskforce2LandUnit1NameOverride=Expeditionary aviation detachment
Taskforce2LandUnit2NameOverride=Long-range SAM battery
