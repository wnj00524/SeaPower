[Language_en]
Taskforce1LandUnit1NameOverride=NAS Sigonella (Sicily)
Taskforce1LandUnit1ShortNameOverride=SIGONELLA
Name=02 Broken Contact
Description=Find and neutralise a Soviet Foxtrot reported inside the convoy approach to the Ionian Sea. Reinforced opposition includes fighter patrols, layered shore defences and independent merchant and fishing traffic.
Objective_Primary=Destroy the designated Foxtrot submarine. Limit: 180 min.
Objective_Survive=Preserve at least one task group vessel
Taskforce1StartMessage=<color=yellow>02 Broken Contact — A noise beneath the traffic</color>|A contact report is not a position. Treat the last bearing as the beginning of the search, and keep your attention on the water while the enemy tries to draw it into the sky.|Destroy the designated Foxtrot submarine within 180 minutes. Preserve at least one task-group vessel. Additional escorts and shore sites are not compulsory targets.|ROE: identify surface contacts before firing. Civilian traffic remains in the area.|No pre-mission rearm or repair is offered for this sortie. Use NAS Sigonella (Sicily) for aircraft you have purchased, assigned and prepared. No free friendly combat aircraft are promised. Ships and ammunition state carry through the campaign.
Taskforce1VictoryMessage=<color=lime>Task complete.</color>|The designated submarine has been destroyed. Operations staff can reopen the approach for planning, but this does not establish that the wider Ionian Sea is clear.|Surviving ships and recorded weapon state carry forward.
Taskforce1DefeatMessage=<color=red>Task failed.</color>|The contact remains an unresolved threat to the approach. The next movement must be delayed or routed around waters whose safety you could not establish.
Taskforce2VictoryMessage=<color=lime>Opposing force successful.</color>|NATO did not accomplish the assigned objective.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The NATO group has completed its mission.
Taskforce2LandUnit1NameOverride=Expeditionary aviation detachment
Taskforce2LandUnit2NameOverride=Long-range SAM battery
