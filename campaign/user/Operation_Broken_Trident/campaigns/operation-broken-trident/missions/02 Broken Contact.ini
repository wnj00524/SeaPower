[Language_en]
Taskforce1LandUnit1NameOverride=NAS Sigonella (Sicily)
Taskforce1LandUnit1ShortNameOverride=SIGONELLA
Name=02 Broken Contact
Description=Find and neutralise a Soviet Foxtrot reported inside the convoy approach to the Ionian Sea. Reinforced opposition includes fighter patrols, layered shore defences and independent merchant and fishing traffic.
Objective_Primary=Destroy the hostile submarines
Objective_Survive=Preserve at least one task group vessel
Taskforce1StartMessage=<color=yellow>Broken Contact</color>|An escort frigate reports torpedo-like transients and is now silent. Last acoustic contact was a Foxtrot-class submarine. Seek a positive contact, and avoid an unnecessary surface engagement with Soviet forces to the east.|THREAT UPDATE: Soviet expeditionary aircraft operate from fictional Libyan access facilities (Syrian access for the Cyprus operation). Expect fighter cover, bomber attacks from separated bearings, silent missile ships and emitting escorts. Shore SAMs defend their air corridors. Three independent merchant/fishing contacts cross the area; radar silence or proximity to an enemy does not establish hostile identity. Identify contacts before engaging.
Taskforce1VictoryMessage=<color=lime>Mission complete.</color>|Sixth Fleet acknowledges tasking complete. Ships and weapon state will be carried forward.
Taskforce1DefeatMessage=<color=red>Mission failed.</color>|Sixth Fleet records the operational objective as failed.
Taskforce2VictoryMessage=<color=lime>Opposing force successful.</color>|NATO did not accomplish the assigned objective.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The NATO group has completed its mission.
