[Language_en]
Taskforce1LandUnit1NameOverride=Souda Bay Air Base (Crete)
Taskforce1LandUnit1ShortNameOverride=SOUDA BAY
Name=10 Iron Ring
Description=Break an integrated Soviet cruiser and destroyer screen between Crete and the Levant. Reinforced opposition includes fighter patrols, layered shore defences and independent merchant and fishing traffic.
Objective_Primary=Destroy the designated Udaloy, Kara and Krivak. Limit: 150 min.
Objective_Survive=Preserve at least one task group vessel
Taskforce1StartMessage=<color=yellow>10 Iron Ring — Three links in the ring</color>|Break the designated screen, not your own formation. Command needs three confirmed losses on the other side and ships left on ours.|Destroy the designated Udaloy, Kara and Krivak within 150 minutes. Preserve at least one task-group vessel. Additional escorts and shore sites are not compulsory targets.|ROE: identify surface contacts before firing. Civilian traffic remains in the area.|Rearm and repair are offered before this mission. Use Souda Bay Air Base (Crete) for aircraft you have purchased, assigned and prepared. No free friendly combat aircraft are promised. Ships and ammunition state carry through the campaign.
Taskforce1VictoryMessage=<color=lime>Task complete.</color>|All three designated screen ships have been destroyed. A local ring has been broken. The remaining force must still prepare for evacuation cover and the final engagement.|Surviving ships and recorded weapon state carry forward.
Taskforce1DefeatMessage=<color=red>Task failed.</color>|The designated screen has not been broken within the allotted time. The enemy retains a barrier that command can no longer assume will collapse before the next movement.
Taskforce2VictoryMessage=<color=lime>Opposing force successful.</color>|NATO did not accomplish the assigned objective.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The NATO group has completed its mission.
Taskforce2LandUnit1NameOverride=Expeditionary aviation detachment
Taskforce2LandUnit2NameOverride=Long-range SAM battery
Taskforce2LandUnit3NameOverride=Airfield point defence
Taskforce2LandUnit4NameOverride=Coastal missile battery
Taskforce2LandUnit5NameOverride=Early warning radar
