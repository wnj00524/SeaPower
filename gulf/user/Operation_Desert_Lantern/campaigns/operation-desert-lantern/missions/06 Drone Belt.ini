[Language_en]
Taskforce1LandUnit1NameOverride=RAFO Masirah (Oman)
Taskforce1LandUnit1ShortNameOverride=MASIRAH
Name=06 Drone Belt
Description=Destroy the forward drone-control and coastal missile sites driving repeated attacks on shipping. Reinforced opposition includes fighter patrols, layered shore defences and independent merchant and fishing traffic.
Objective_Primary=Destroy coastal targets 1 and 6; defeat the assigned surface threat. Limit: 150 min.
Objective_Survive=Preserve at least one task group vessel
Taskforce1StartMessage=<color=yellow>06 Drone Belt</color>|Iranian missile and drone attacks are disrupting commercial traffic. Enemy surface units are operating offshore while coastal sensors and launch sites support follow-on strikes.|Destroy Taskforce2LandUnit1 and Taskforce2LandUnit6, defeat the designated surface threat, and preserve at least one task-group vessel within 150 minutes.|Protect shipping and keep civilian traffic clear of weapon engagements.|Air Tasking preparation is available at RAFO Masirah (Oman): four ready group slots and eight in-progress slots. Assign aircraft before launch.
Taskforce1VictoryMessage=<color=lime>Task complete.</color>|The assigned coastal targets and surface threat are neutralized. Shipping can continue under escort, though the wider threat remains.|Surviving ships and recorded weapon state carry forward.
Taskforce1DefeatMessage=<color=red>Task failed.</color>|The strike network remains operational or the shipping group was lost. The corridor cannot be declared safe.
Taskforce2VictoryMessage=<color=lime>Opposing force successful.</color>|The protected shipping route remains exposed.
Taskforce2DefeatMessage=<color=red>Opposing force defeated.</color>|The strike force has failed to stop the attack.
