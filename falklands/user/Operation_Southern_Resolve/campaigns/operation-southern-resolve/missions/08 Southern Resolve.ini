Objective_Survive=Preserve at least one task-force vessel
Taskforce1StartMessage=<color=yellow>08 Southern Resolve</color>|The occupation command has concentrated its surviving Argentine, Venezuelan and Cuban ships east of the islands. Break this last sea screen so the British force can approach. A ground assault and the political settlement occur after the naval campaign; sinking ships alone does not capture Stanley.|ORDERS: Destroy all three designated coalition warships within 180 minutes. Preserve at least one task-force vessel.|ROE: positively identify surface contacts. Only the designated military logistics ships are hostile; civilian traffic is not a target.|No pre-mission rearm or repair. Conserve ammunition.
Taskforce1VictoryMessage=<color=lime>Naval objective complete.</color>|The sea screen is broken. British landing operations may proceed; liberation ashore remains outside this campaign.
Taskforce1DefeatMessage=<color=red>Naval objective failed.</color>|The assigned operation cannot proceed. Command must revise the movement plan.
