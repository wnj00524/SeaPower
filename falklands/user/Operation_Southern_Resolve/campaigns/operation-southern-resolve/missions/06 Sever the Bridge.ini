[Language_en]
Name=06 Sever the Bridge
Description=Cuba is rushing a second military logistics echelon toward the occupied islands. Its stores transport and Argentine escort must be stopped before unloading. The opposing force is already at sea; this mission does not simulate transport from the Caribbean.
Objective_Primary=Destroy the designated Cuban military transport and Argentine escort within 180 minutes.
Objective_Survive=Preserve at least one task-force vessel
Taskforce1StartMessage=<color=yellow>06 Sever the Bridge</color>|Cuba is rushing a second military logistics echelon toward the occupied islands. Its stores transport and Argentine escort must be stopped before unloading. The opposing force is already at sea; this mission does not simulate transport from the Caribbean.|ORDERS: Destroy the designated Cuban military transport and Argentine escort within 180 minutes. Preserve at least one task-force vessel.|ROE: positively identify surface contacts. Only the designated military logistics ships are hostile; civilian traffic is not a target.|No pre-mission rearm or repair. Conserve ammunition.
Taskforce1VictoryMessage=<color=lime>Naval objective complete.</color>|Report survivors, damage and ammunition expenditure. The occupation remains in place; prepare for the next operation.
Taskforce1DefeatMessage=<color=red>Naval objective failed.</color>|The assigned operation cannot proceed. Command must revise the movement plan.
