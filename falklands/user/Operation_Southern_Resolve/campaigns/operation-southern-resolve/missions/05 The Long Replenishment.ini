[Language_en]
Name=05 The Long Replenishment
Description=A British-chartered stores ship is approaching the offshore replenishment box. Venezuelan escorts and Argentine attack aircraft have been redirected against it. Deliver the ship; relief and ammunition for the next phase depend on this rendezvous.
Objective_Primary=Escort the stores ship into the marked replenishment box within 180 minutes.
Objective_Survive=Preserve at least one task-force vessel
Taskforce1StartMessage=<color=yellow>05 The Long Replenishment</color>|A British-chartered stores ship is approaching the offshore replenishment box. Venezuelan escorts and Argentine attack aircraft have been redirected against it. Deliver the ship; relief and ammunition for the next phase depend on this rendezvous.|ORDERS: Escort the stores ship into the marked replenishment box within 180 minutes. Preserve at least one task-force vessel.|ROE: positively identify surface contacts. Only the designated military logistics ships are hostile; civilian traffic is not a target.|Pre-mission rearm and repair available.
